<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legacy → Verified</title>
<style>
  :root { --ink: #e8eaf2; --dim: rgba(232,234,242,.45); --line: rgba(232,234,242,.12); --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  html, body { margin: 0; height: 100%; background: #07070a; color: var(--ink); font-family: var(--mono); overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: default; }
  canvas.pointer { cursor: pointer; }
  .controls { position: fixed; left: 24px; bottom: 20px; display: flex; gap: 14px; align-items: center; opacity: .38; transition: opacity .3s; font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; }
  .controls:hover, .controls:focus-within { opacity: .95; }
  .controls button, .controls select { background: none; border: 0; color: var(--ink); font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; padding: 4px 0; }
  .controls select { appearance: none; -webkit-appearance: none; border-bottom: 1px solid var(--line); padding-right: 4px; }
  .controls select option { background: #111018; text-transform: none; letter-spacing: 0; }
  .controls .sep { width: 1px; height: 12px; background: var(--line); }
  .panel { position: fixed; top: 0; right: 0; height: 100vh; width: min(620px, 92vw); box-sizing: border-box; padding: 28px 30px 24px; background: rgba(11, 9, 18, .84); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-left: 1px solid rgba(232,234,242,.08); transform: translateX(104%); transition: transform .45s cubic-bezier(.2,.7,.2,1); display: flex; flex-direction: column; gap: 18px; z-index: 5; }
  .panel.open { transform: none; }
  .panel header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .panel h2 { margin: 0; font-weight: 400; font-size: 13px; letter-spacing: 4px; text-transform: uppercase; }
  .panel .meta { font-size: 11px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; margin-top: 6px; }
  .panel .close { background: none; border: 0; color: var(--dim); font: 18px var(--mono); cursor: pointer; padding: 0 2px; }
  .panel .close:hover { color: var(--ink); }
  .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); }
  .tabs button { background: none; border: 0; color: var(--dim); font: 11px var(--mono); letter-spacing: 2.5px; text-transform: uppercase; padding: 0 0 10px; cursor: pointer; border-bottom: 1px solid transparent; margin-bottom: -1px; }
  .tabs button.on { color: var(--ink); border-bottom-color: rgba(200,180,255,.8); }
  .body { flex: 1; overflow: auto; font-size: 12.5px; line-height: 1.65; color: rgba(232,234,242,.82); }
  .body pre { margin: 0; white-space: pre; font: inherit; }
  .body .k { color: var(--dim); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin: 16px 0 6px; }
  .body .k:first-child { margin-top: 0; }
  .body table { border-collapse: collapse; width: 100%; }
  .body td { padding: 5px 10px 5px 0; border-bottom: 1px solid rgba(232,234,242,.06); vertical-align: top; white-space: pre; }
  .body td:first-child { color: var(--dim); }
  .body .bad { color: #ffb4c8; }
  .body .good { color: #b9f0dc; }
  .body .att { padding: 12px 0; border-bottom: 1px solid rgba(232,234,242,.06); }
  .body .att p { margin: 4px 0 0; white-space: normal; }
  /* station views: every station panel is built only from these (web/stations/registry.js) */
  .panel.station { width: min(780px, 94vw); }
  .st-sec { margin: 0 0 26px; }
  .st-label { font-size: 10.5px; letter-spacing: 3px; text-transform: uppercase; color: var(--dim); margin: 0 0 10px; }
  .st-text { margin: 0 0 8px; white-space: normal; color: rgba(232,234,242,.85); }
  .st-empty { margin: 0; color: var(--dim); font-style: italic; white-space: normal; }
  .st-stats { display: flex; gap: 36px; flex-wrap: wrap; }
  .st-stat-v { font-size: 30px; font-weight: 300; letter-spacing: 1px; color: #f4f4f8; line-height: 1.1; }
  .st-stat-l { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--dim); margin-top: 6px; }
  .st-stat.st-ok .st-stat-v { color: #b9f0dc; } .st-stat.st-bad .st-stat-v { color: #ffc4d4; } .st-stat.st-dim .st-stat-v { color: rgba(232,234,242,.55); }
  .st-tag { display: inline-block; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; padding: 2px 8px; border: 1px solid var(--line); border-radius: 3px; margin-right: 6px; }
  .st-tag.st-ok { color: #b9f0dc; border-color: rgba(185,240,220,.3); } .st-tag.st-bad { color: #ffc4d4; border-color: rgba(255,196,212,.3); }
  .st-tag.st-accent { color: #d8c8ff; border-color: rgba(200,180,255,.35); } .st-tag.st-dim { color: var(--dim); }
  .st-kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 22px; margin: 0; }
  .st-kv dt { color: var(--dim); } .st-kv dd { margin: 0; white-space: normal; }
  .st-list { margin: 0; padding-left: 18px; white-space: normal; } .st-list li { margin: 0 0 6px; }
  .st-table { border-collapse: collapse; width: 100%; font-size: 12px; }
  .st-table th { text-align: left; font-weight: 400; font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--dim); padding: 0 12px 8px 0; border-bottom: 1px solid var(--line); }
  .st-table td { padding: 6px 12px 6px 0; border-bottom: 1px solid rgba(232,234,242,.05); white-space: pre; vertical-align: top; }
  .st-table tr.st-ok td:first-child { box-shadow: inset 2px 0 0 rgba(185,240,220,.6); padding-left: 8px; }
  .st-table tr.st-bad td { color: #ffc4d4; } .st-table tr.st-bad td:first-child { box-shadow: inset 2px 0 0 rgba(255,150,180,.7); padding-left: 8px; }
  .st-code { font-size: 12px; line-height: 1.6; border-left: 1px solid var(--line); }
  .st-line { white-space: pre; padding-left: 10px; color: rgba(232,234,242,.62); }
  .st-line.st-hi { color: #f4f4f8; background: rgba(200,180,255,.07); box-shadow: inset 2px 0 0 rgba(200,180,255,.7); }
  .st-ln { display: inline-block; width: 30px; color: rgba(232,234,242,.25); user-select: none; }
  .st-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; } .st-cols > div { min-width: 0; overflow: auto; }
  .st-diff { font-size: 15px; letter-spacing: .5px; } .st-diff-row { display: flex; gap: 18px; align-items: baseline; margin: 4px 0; }
  .st-diff-l { width: 70px; font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--dim); text-align: right; }
  .st-diff-v { color: rgba(232,234,242,.5); white-space: pre; } .st-diff b { font-weight: 400; }
  .st-diff .st-same { color: #f4f4f8; } .st-diff .st-wrong { color: #ffc4d4; text-shadow: 1px 0 rgba(120,220,255,.5), -1px 0 rgba(255,120,170,.6); }
  .st-quote { margin: 8px 0 0; padding: 0 0 0 14px; border-left: 1px solid rgba(200,180,255,.5); white-space: normal; color: rgba(232,234,242,.88); }
  .st-quote cite { display: block; margin-top: 6px; font-style: normal; font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(200,180,255,.8); }
  .st-chain { font-size: 13px; letter-spacing: 3px; } .st-arrow { color: var(--dim); margin: 0 12px; letter-spacing: 0; }
  .st-dots { display: flex; flex-wrap: wrap; gap: 7px; } .st-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(232,234,242,.2); }
  .st-dot.st-ok { background: #b9f0dc; box-shadow: 0 0 6px rgba(185,240,220,.6); } .st-dot.st-bad { background: #ff9fbb; box-shadow: 0 0 6px rgba(255,140,175,.7); }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 11px; letter-spacing: 4px; color: var(--dim); text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="sky" aria-label="Replay of a COBOL to Python migration shown as stars traveling through pipeline stations"></canvas>
<div class="loading" id="loading">Loading replay…</div>
<div class="controls" role="toolbar" aria-label="Replay controls">
  <button id="play" aria-label="Pause">Pause</button>
  <button id="restart">Restart</button>
  <span class="sep"></span>
  <select id="speed" aria-label="Speed"><option value="0.6">0.6×</option><option value="1" selected>1×</option><option value="1.6">1.6×</option><option value="2.5">2.5×</option></select>
  <span class="sep"></span>
  <select id="replay" aria-label="Replay"></select>
</div>
<aside class="panel" id="panel" aria-hidden="true">
  <header>
    <div><h2 id="p-title"></h2><div class="meta" id="p-meta"></div></div>
    <button class="close" id="p-close" aria-label="Close">×</button>
  </header>
  <nav class="tabs" id="p-tabs"></nav>
  <div class="body" id="p-body"></div>
</aside>
<script src="stations/registry.js"></script>
<!-- one file per station; each person edits only their own -->
<script src="stations/01-discover.js"></script>
<script src="stations/02-read.js"></script>
<script src="stations/03-probe.js"></script>
<script src="stations/04-record.js"></script>
<script src="stations/05-rewrite.js"></script>
<script src="stations/06-verify.js"></script>
<script src="stations/07-verified.js"></script>
<script src="galaxy.js"></script>
</body>
</html>
