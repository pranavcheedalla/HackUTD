<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legacy → Verified</title>
<style>
  :root { --ink: #e8eaf2; --dim: rgba(232,234,242,.45); --line: rgba(232,234,242,.12); --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  html, body { margin: 0; height: 100%; background: #07070a; color: var(--ink); font-family: var(--mono); overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: default; }
  canvas.pointer { cursor: pointer; }
  .controls { position: fixed; left: 24px; bottom: 20px; display: flex; gap: 14px; align-items: center; opacity: .38; transition: opacity .3s; font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; }
  .controls:hover, .controls:focus-within { opacity: .95; }
  .controls button, .controls select { background: none; border: 0; color: var(--ink); font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; padding: 4px 0; }
  .controls select { appearance: none; -webkit-appearance: none; border-bottom: 1px solid var(--line); padding-right: 4px; }
  .controls select option { background: #111018; text-transform: none; letter-spacing: 0; }
  .controls .sep { width: 1px; height: 12px; background: var(--line); }
  /* The readout: an annotation in the sky, not a drawer. The galaxy stays visible behind it,
     darkened toward the right; a leader line on the canvas ties it to the ring or star. */
  .panel { position: fixed; top: 0; right: 0; height: 100vh; width: min(560px, max(380px, calc(100vw - 420px))); box-sizing: border-box; padding: 58px 46px 34px 78px;
    background: linear-gradient(90deg, rgba(6,5,13,0) 0%, rgba(6,5,13,.84) 11%, rgba(6,5,13,.93) 32%, rgba(6,5,13,.95) 100%);
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 70px); mask-image: linear-gradient(90deg, transparent 0, #000 70px);
    opacity: 0; transform: translateX(28px); pointer-events: none; transition: opacity .55s ease, transform .7s cubic-bezier(.2,.7,.2,1);
    display: flex; flex-direction: column; gap: 22px; z-index: 5; }
  .panel.open { opacity: 1; transform: none; pointer-events: auto; }
  .panel.station { width: min(700px, max(400px, calc(100vw - 400px))); }
  .panel header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .panel h2 { margin: 0; font-weight: 400; font-size: 12px; letter-spacing: 5px; text-transform: uppercase; color: rgba(242,241,248,.94); }
  .panel .meta { font-size: 9.5px; letter-spacing: 3px; color: rgba(232,234,242,.42); text-transform: uppercase; margin-top: 9px; }
  .panel .close { background: none; border: 0; color: rgba(232,234,242,.38); font: 9.5px var(--mono); letter-spacing: 3px; text-transform: uppercase; cursor: pointer; padding: 2px 0; }
  .panel .close::after { content: 'Esc'; }
  .panel .close:hover { color: var(--ink); }
  .tabs { display: flex; gap: 28px; }
  .tabs button { background: none; border: 0; color: rgba(232,234,242,.36); font: 9.5px var(--mono); letter-spacing: 3px; text-transform: uppercase; padding: 0 0 8px; cursor: pointer; position: relative; transition: color .3s; }
  .tabs button:hover { color: rgba(232,234,242,.7); }
  .tabs button.on { color: rgba(242,241,248,.95); }
  .tabs button.on::after { content: ''; position: absolute; left: 50%; bottom: 0; width: 3px; height: 3px; margin-left: -1.5px; border-radius: 50%; background: #d4c4ff; box-shadow: 0 0 6px 1px rgba(200,180,255,.7); }
  .body { flex: 1; overflow: auto; font-size: 12px; line-height: 1.75; color: rgba(232,234,242,.7); padding-right: 6px;
    -webkit-mask-image: linear-gradient(#000 calc(100% - 46px), transparent); mask-image: linear-gradient(#000 calc(100% - 46px), transparent); padding-bottom: 46px; }
  .body::-webkit-scrollbar { width: 3px; } .body::-webkit-scrollbar-thumb { background: rgba(232,234,242,.1); border-radius: 2px; }
  .body > * { opacity: 0; transform: translateY(6px); animation: drift .7s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--i, 0) * 70ms + 140ms); }
  @keyframes drift { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .body > * { animation: none; opacity: 1; transform: none; } .panel { transition: opacity .2s; } }
  /* building blocks (web/stations/registry.js): every view is made only of these */
  .st-sec { margin: 0 0 30px; }
  .st-label { display: flex; align-items: center; gap: 12px; font-size: 9.5px; letter-spacing: 3.5px; text-transform: uppercase; color: rgba(232,234,242,.4); margin: 0 0 12px; }
  .st-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(232,234,242,.14), rgba(232,234,242,0)); }
  .st-label:empty { display: none; }
  .st-text { margin: 0 0 10px; white-space: normal; }
  .st-empty { margin: 0 0 10px; color: rgba(232,234,242,.38); white-space: normal; }
  .st-empty::before { content: '—  '; }
  .st-stats { display: flex; gap: 44px; flex-wrap: wrap; margin: 0 0 30px; }
  .st-stat-v { font-size: 34px; font-weight: 200; letter-spacing: 2px; color: #f2f1f8; line-height: 1.05; }
  .st-stat-l { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: rgba(232,234,242,.4); margin-top: 9px; }
  .st-stat.st-ok .st-stat-v { color: #c9f5e6; text-shadow: 0 0 22px rgba(150,240,210,.28); }
  .st-stat.st-bad .st-stat-v { color: #ffd2de; text-shadow: 0 0 22px rgba(255,140,175,.3); }
  .st-stat.st-dim .st-stat-v { color: rgba(232,234,242,.5); }
  .st-tag { display: inline-flex; align-items: center; gap: 8px; font-size: 9.5px; letter-spacing: 3px; text-transform: uppercase; margin: 0 16px 8px 0; color: rgba(232,234,242,.5); }
  .st-tag::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; }
  .st-tag.st-ok { color: #b9f0dc; } .st-tag.st-bad { color: #ffb8cb; } .st-tag.st-accent { color: #d4c4ff; }
  .st-kv { display: grid; grid-template-columns: max-content 1fr; gap: 8px 26px; margin: 0; }
  .st-kv dt { font-size: 9.5px; letter-spacing: 3px; text-transform: uppercase; color: rgba(232,234,242,.38); padding-top: 2px; } .st-kv dd { margin: 0; white-space: normal; color: rgba(232,234,242,.78); }
  .st-list { margin: 0; padding: 0; list-style: none; white-space: normal; counter-reset: st; }
  .st-list li { position: relative; padding-left: 22px; margin: 0 0 8px; }
  .st-list li::before { content: ''; position: absolute; left: 4px; top: .78em; width: 3px; height: 3px; border-radius: 50%; background: rgba(212,196,255,.7); box-shadow: 0 0 5px rgba(200,180,255,.6); }
  ol.st-list li { counter-increment: st; } ol.st-list li::before { content: counter(st, decimal-leading-zero); width: auto; height: auto; top: 0; left: 0; background: none; box-shadow: none; font-size: 9.5px; letter-spacing: 1px; color: rgba(212,196,255,.6); }
  .st-table { border-collapse: collapse; width: 100%; font-size: 11.5px; }
  .st-table th { text-align: left; font-weight: 400; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: rgba(232,234,242,.36); padding: 0 16px 10px 0; }
  .st-table td { padding: 5px 16px 5px 0; border-top: 1px dotted rgba(232,234,242,.07); white-space: pre; vertical-align: top; color: rgba(232,234,242,.66); }
  .st-table td:first-child { color: rgba(232,234,242,.42); }
  .st-table tr.st-ok td:first-child::before, .st-table tr.st-bad td:first-child::before { content: ''; display: inline-block; width: 4px; height: 4px; border-radius: 50%; margin: 0 9px 1px 0; vertical-align: middle; }
  .st-table tr.st-ok td:first-child::before { background: #b9f0dc; box-shadow: 0 0 5px rgba(150,240,210,.7); }
  .st-table tr.st-bad td { color: #ffc7d5; } .st-table tr.st-bad td:first-child::before { background: #ff9fbb; box-shadow: 0 0 5px rgba(255,140,175,.8); }
  .st-code { font-size: 11.5px; line-height: 1.72; overflow-x: auto; padding-left: 2px; background: linear-gradient(rgba(232,234,242,.1), rgba(232,234,242,0)) 34px 0 / 1px 100% no-repeat; }
  .st-line { white-space: pre; color: rgba(232,234,242,.4); }
  .st-line.st-hi { color: #f3f1fb; text-shadow: 0 0 14px rgba(200,180,255,.22); }
  .st-ln { display: inline-block; width: 26px; margin-right: 16px; text-align: right; color: rgba(232,234,242,.16); user-select: none; position: relative; }
  .st-hi .st-ln { color: rgba(212,196,255,.75); }
  .st-hi .st-ln::after { content: ''; position: absolute; right: -11px; top: .72em; width: 3px; height: 3px; border-radius: 50%; background: #d4c4ff; box-shadow: 0 0 6px rgba(200,180,255,.9); }
  .st-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; } .st-cols > div { min-width: 0; overflow: auto; }
  .st-diff { font-size: 17px; font-weight: 300; letter-spacing: 1px; margin: 4px 0 14px; }
  .st-diff-row { display: flex; gap: 20px; align-items: baseline; margin: 2px 0; }
  .st-diff-l { width: 64px; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: rgba(232,234,242,.38); text-align: right; flex: none; }
  .st-diff-row + .st-diff-row .st-diff-l { color: rgba(255,200,215,.5); }
  .st-diff-v { color: rgba(232,234,242,.42); white-space: pre; } .st-diff b { font-weight: 300; }
  .st-diff .st-same { color: #f6f5fb; } .st-diff .st-wrong { color: #ffd6e1; text-shadow: 1.2px 0 rgba(120,220,255,.55), -1.2px 0 rgba(255,120,170,.65); }
  .st-quote { margin: 4px 0 16px; padding: 0; white-space: normal; color: rgba(236,234,246,.86); font-size: 12px; letter-spacing: .2px; }
  .st-quote::before { content: ''; display: block; width: 22px; height: 1px; margin: 0 0 10px; background: linear-gradient(90deg, rgba(212,196,255,.8), rgba(212,196,255,0)); }
  .st-quote cite { display: block; margin-top: 8px; font-style: normal; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: rgba(212,196,255,.75); }
  .st-chain { display: flex; align-items: center; font-size: 11px; letter-spacing: 4px; color: rgba(242,241,248,.9); margin: 0 0 10px; }
  .st-arrow { flex: 0 0 56px; height: 1px; margin: 0 16px; background: linear-gradient(90deg, rgba(212,196,255,.15), rgba(212,196,255,.8)); color: transparent; overflow: hidden; }
  .st-dots { display: flex; flex-wrap: wrap; gap: 9px; margin: 2px 0 12px; }
  .st-dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(232,234,242,.2); }
  .st-dot.st-ok { background: #c9f5e6; box-shadow: 0 0 5px 1px rgba(150,240,210,.55); }
  .st-dot.st-bad { background: #ffb3c6; box-shadow: 0 0 6px 1px rgba(255,140,175,.75); }
  /* intake: pick or drop a codebase. Same sky, same type: no cards, no boxes */
  .intake { position: fixed; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center; padding: 6vh 6vw; box-sizing: border-box;
    background: radial-gradient(ellipse at 50% 45%, rgba(6,5,13,.35), rgba(6,5,13,.82) 75%); opacity: 0; pointer-events: none; transition: opacity .6s ease; }
  .intake.open { opacity: 1; pointer-events: auto; }
  body.intake-on .controls { opacity: 0; pointer-events: none; }
  .in-wrap { width: min(760px, 100%); display: flex; flex-direction: column; gap: 30px; }
  .in-title { font-size: 13px; letter-spacing: 8px; text-transform: uppercase; color: rgba(242,241,248,.92); }
  .in-lede { margin: -14px 0 0; font: 400 19px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Arial, sans-serif; color: rgba(242,241,248,.86); max-width: 600px; }
  .drop { position: relative; display: flex; align-items: center; gap: 22px; padding: 6px 0; cursor: pointer; width: max-content; max-width: 100%; }
  .drop-ring { width: 46px; height: 46px; border-radius: 50%; border: 1px dashed rgba(212,196,255,.55); flex: none; position: relative; transition: transform .4s cubic-bezier(.2,.7,.2,1), border-color .3s; }
  .drop-ring::after { content: ''; position: absolute; inset: 20px; border-radius: 50%; background: #e9e2ff; box-shadow: 0 0 10px 2px rgba(200,180,255,.6); }
  .drop:hover .drop-ring, .drop.over .drop-ring { transform: scale(1.12); border-color: rgba(230,220,255,.95); }
  .drop-t { font-size: 10.5px; letter-spacing: 3.5px; text-transform: uppercase; color: rgba(242,241,248,.9); }
  .drop-s { display: block; margin-top: 6px; font-size: 9.5px; letter-spacing: 3px; text-transform: uppercase; color: rgba(232,234,242,.4); }
  .in-label { display: flex; align-items: center; gap: 12px; font-size: 9.5px; letter-spacing: 3.5px; text-transform: uppercase; color: rgba(232,234,242,.4); }
  .in-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(232,234,242,.14), rgba(232,234,242,0)); }
  .in-list { display: flex; flex-direction: column; gap: 0; margin-top: -14px; }
  .cb { display: grid; grid-template-columns: 1fr auto; gap: 4px 24px; align-items: baseline; padding: 16px 0; border-top: 1px dotted rgba(232,234,242,.08); }
  .cb-name { font: 400 17px/1.3 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Arial, sans-serif; color: rgba(242,241,248,.94); }
  .cb-meta { font-size: 9.5px; letter-spacing: 3px; text-transform: uppercase; color: rgba(232,234,242,.42); grid-column: 1; }
  .cb-about { font: 400 13.5px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Arial, sans-serif; color: rgba(232,234,242,.6); grid-column: 1; }
  .cb-act { grid-column: 2; grid-row: 1 / span 3; display: flex; gap: 22px; align-self: center; }
  .cb-act button { background: none; border: 0; padding: 4px 0; cursor: pointer; font: 9.5px var(--mono); letter-spacing: 3px; text-transform: uppercase; color: rgba(232,234,242,.5); display: inline-flex; align-items: center; gap: 8px; transition: color .25s; }
  .cb-act button::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; }
  .cb-act button:hover { color: rgba(242,241,248,.95); }
  .cb-act button.live { color: #c9f5e6; } .cb-act button.live:hover { color: #e6fff6; }
  .cb-act button[disabled] { opacity: .35; cursor: default; }
  .in-note { min-height: 18px; font: 400 13px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Arial, sans-serif; color: rgba(232,234,242,.62); }
  .in-note.bad { color: #ffc4d4; }
  .in-foot { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: rgba(232,234,242,.3); }
  @media (max-width: 640px) { .cb { grid-template-columns: 1fr; } .cb-act { grid-column: 1; grid-row: auto; margin-top: 6px; } }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 11px; letter-spacing: 4px; color: var(--dim); text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="sky" aria-label="Replay of a COBOL to Python migration shown as stars traveling through pipeline stations"></canvas>
<div class="loading" id="loading">Loading replay…</div>
<div class="controls" role="toolbar" aria-label="Replay controls">
  <button id="play" aria-label="Pause">Pause</button>
  <button id="restart">Restart</button>
  <span class="sep"></span>
  <select id="speed" aria-label="Speed"><option value="0.6">0.6×</option><option value="1" selected>1×</option><option value="1.6">1.6×</option><option value="2.5">2.5×</option></select>
  <span class="sep"></span>
  <select id="replay" aria-label="Replay"></select>
  <span class="sep"></span>
  <button id="intake-btn">Codebases</button>
  <button id="fallback" hidden>Switch to recording</button>
</div>
<section class="intake" id="intake" aria-hidden="true">
  <div class="in-wrap">
    <div class="in-title">Legacy  →  Verified</div>
    <p class="in-lede">Drop a COBOL codebase. NVIDIA Nemotron agents move it to Python, and the original program checks every answer.</p>
    <label class="drop" id="drop" title="Drop a .zip of COBOL files">
      <input type="file" id="drop-file" accept=".zip,application/zip" hidden>
      <span class="drop-ring" aria-hidden="true"></span>
      <span><span class="drop-t">Drop a .zip of COBOL</span><span class="drop-s" id="drop-s">or pick a codebase below</span></span>
    </label>
    <div class="in-label">Codebases</div>
    <div class="in-list" id="in-list"></div>
    <div class="in-note" id="in-note" role="status"></div>
    <div class="in-foot" id="in-foot"></div>
  </div>
</section>
<aside class="panel" id="panel" aria-hidden="true">
  <header>
    <div><h2 id="p-title"></h2><div class="meta" id="p-meta"></div></div>
    <button class="close" id="p-close" aria-label="Close"></button>
  </header>
  <nav class="tabs" id="p-tabs"></nav>
  <div class="body" id="p-body"></div>
</aside>
<script src="stations/registry.js"></script>
<!-- one file per station; each person edits only their own -->
<script src="stations/01-discover.js"></script>
<script src="stations/02-read.js"></script>
<script src="stations/03-probe.js"></script>
<script src="stations/04-record.js"></script>
<script src="stations/05-rewrite.js"></script>
<script src="stations/06-verify.js"></script>
<script src="stations/07-verified.js"></script>
<script src="captions.js"></script>
<script src="galaxy.js"></script>
</body>
</html>
